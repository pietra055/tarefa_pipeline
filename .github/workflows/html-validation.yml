name: Validação HTML

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  htmlhint:
    name: HTMLHint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar HTMLHint
        run: npm install -g htmlhint

      - name: Validar HTML
        run: htmlhint "*.html"

  html-file:
    name: HTML File Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verificar arquivos HTML
        run: ls *.html

  links:
    name: Verificação de Arquivos HTML
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verificar se existe index.html
        run: test -f index.html